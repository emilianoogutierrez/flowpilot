name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -r requirements.lock && python -m pip install -e ".[dev]"
      - run: npm ci
      - run: python scripts/check.py
      - run: python scripts/http_smoke.py
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser_smoke.py
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: flowpilot
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: flowpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowpilot -d flowpilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.lock && python -m pip install -e ".[dev,postgres]"
      - run: python -m pytest -m postgres
        env:
          TEST_DATABASE_URL: postgresql+psycopg://flowpilot:test-only-password@localhost:5432/flowpilot_test
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python scripts/bootstrap.py
      - run: docker compose up --build --detach --wait api worker
      - run: curl --fail http://localhost:8000/health/ready
      - if: always()
        run: docker compose logs --no-color && docker compose down -v
