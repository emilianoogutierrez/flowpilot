[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flowpilot"
version = "0.1.0"
description = "Durable, inspectable workflow execution for small software teams"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Emiliano Gutierrez"}]
dependencies = [
  "fastapi==0.128.2", "uvicorn==0.48.0", "SQLAlchemy==2.0.50",
  "alembic==1.18.4", "pydantic==2.13.4", "pydantic-settings==2.15.0",
  "argon2-cffi==25.1.0", "cryptography==46.0.4", "httpx==0.28.1",
  "jsonschema==4.26.0", "opentelemetry-api==1.42.1", "opentelemetry-sdk==1.42.1",
  "opentelemetry-exporter-otlp-proto-http==1.42.1"
]

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.3.5"]
dev = ["pytest==9.0.2", "pytest-cov==7.0.0", "playwright>=1.49,<2", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[project.scripts]
flowpilot = "flowpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["postgres: requires TEST_DATABASE_URL pointing to an isolated PostgreSQL database"]

[tool.coverage.run]
source = ["flowpilot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
